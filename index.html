<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mun Vaasal - South Indian Kolam Studio</title>
    <style>
        :root {
            --bg-color: #1a0f0a;
            --card-bg: #2d1a12;
            --accent: #ff6b35;
            --accent-glow: rgba(255, 107, 53, 0.4);
            --text-main: #f4e8dc;
            --text-muted: #c2b2a3;
            --dot-color: #ffb703;
            --line-color: #ff6b35;
        }

        [data-theme="indigo"] {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent: #48cae4;
            --accent-glow: rgba(72, 202, 228, 0.4);
            --dot-color: #90e0ef;
            --line-color: #00b4d8;
        }

        [data-theme="emerald"] {
            --bg-color: #081c15;
            --card-bg: #1b4332;
            --accent: #52b788;
            --accent-glow: rgba(82, 183, 136, 0.4);
            --dot-color: #d8f3dc;
            --line-color: #74c69d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        canvas {
            touch-action: none;
            cursor: pointer;
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        button, select {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.active-toggle {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        select {
            grid-column: span 3;
            font-size: 0.8rem;
        }

        button:active {
            transform: scale(0.96);
        }

        button.primary {
            background: var(--accent);
            color: #fff;
            grid-column: span 3;
            box-shadow: 0 4px 12px var(--accent-glow);
            font-size: 0.85rem;
        }

        .info-box {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            padding: 4px;
            line-height: 1.3;
        }
    </style>
</head>
<body data-theme="terracotta">

    <header>
        <h1>Mun Vaasal (முன் வாசல்)</h1>
        <p class="subtitle">Digital South Indian Pulli Kolam Studio</p>
    </header>

    <div class="app-container">
        <div class="canvas-wrapper">
            <canvas id="kolamCanvas"></canvas>
        </div>

        <div class="controls-grid">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="terracotta">Terracotta Heritage</option>
                <option value="indigo">Night Indigo</option>
                <option value="emerald">Sacred Emerald</option>
            </select>
            <button onclick="undoLastLine()">Undo</button>
            <button id="mirrorBtn" onclick="toggleMirrorMode()">Mirror Mode: OFF</button>
            <button onclick="clearCanvas()">Clear</button>
            <button onclick="generateProceduralKolam()" class="primary">Auto-Generate Pulli Kolam</button>
        </div>

        <div class="info-box">
            Tap consecutive <strong>Pulli (dots)</strong> to draw lines. Turn on <strong>Mirror Mode</strong> to automatically reflect every stroke live!
        </div>
    </div>

    <script>
        var canvas = document.getElementById('kolamCanvas');
        var ctx = canvas.getContext('2d');
        
        var points = [];
        var lines = []; 
        var selectedPoint = null;
        var isMirrorActive = false;

        var gridSize = 5; 
        var spacing = 0;

        function resizeCanvas() {
            var rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            spacing = canvas.width / (gridSize + 1);
            initGrid();
            drawScene();
        }

        function initGrid() {
            points = [];
            for (var r = 0; r < gridSize; r++) {
                for (var c = 0; c < gridSize; c++) {
                    points.push({
                        row: r,
                        col: c,
                        id: r * gridSize + c,
                        x: spacing * (c + 1),
                        y: spacing * (r + 1)
                    });
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            var dotColor = getComputedStyle(document.body).getPropertyValue('--dot-color').trim() || '#ffb703';
            var lineColor = getComputedStyle(document.body).getPropertyValue('--line-color').trim() || '#ff6b35';

            // 1. Draw Lines
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            lines.forEach(function(line) {
                ctx.beginPath();
                ctx.moveTo(line.from.x, line.from.y);
                ctx.lineTo(line.to.x, line.to.y);
                ctx.stroke();
            });

            // 2. Draw Dots (Pulli)
            points.forEach(function(p) {
                ctx.beginPath();
                var radius = 7;
                if (selectedPoint && selectedPoint.id === p.id) {
                    radius = 11;
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = dotColor;
                }
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            drawScene();
        }

        function clearCanvas() {
            lines = [];
            selectedPoint = null;
            drawScene();
        }

        function undoLastLine() {
            if (lines.length > 0) {
                var last = lines.pop();
                if (last && last.isMirrored && lines.length > 0) {
                    lines.pop();
                }
            }
            selectedPoint = null;
            drawScene();
        }

        function toggleMirrorMode() {
            isMirrorActive = !isMirrorActive;
            var btn = document.getElementById('mirrorBtn');
            if (isMirrorActive) {
                btn.innerText = "Mirror Mode: ON";
                btn.classList.add('active-toggle');
            } else {
                btn.innerText = "Mirror Mode: OFF";
                btn.classList.remove('active-toggle');
            }
        }

        function addLineSegment(fromPoint, toPoint) {
            lines.push({ from: fromPoint, to: toPoint, isMirrored: false });

            if (isMirrorActive) {
                var mirroredFrom = points.find(function(p) { return p.row === fromPoint.row && p.col === (gridSize - 1 - fromPoint.col); });
                var mirroredTo = points.find(function(p) { return p.row === toPoint.row && p.col === (gridSize - 1 - toPoint.col); });

                if (mirroredFrom && mirroredTo) {
                    var isSameLine = (mirroredFrom.id === fromPoint.id && mirroredTo.id === toPoint.id) ||
                                     (mirroredFrom.id === toPoint.id && mirroredTo.id === fromPoint.id);
                    if (!isSameLine) {
                        lines.push({ from: mirroredFrom, to: mirroredTo, isMirrored: true });
                    }
                }
            }
        }

        function generateProceduralKolam() {
            lines = [];
            selectedPoint = null;
            var current = points[Math.floor(Math.random() * points.length)];

            for (var i = 0; i < 5; i++) {
                var neighbors = points.filter(function(p) { return p.id !== current.id; });
                var next = neighbors[Math.floor(Math.random() * neighbors.length)];
                
                var mirroredFrom = points.find(function(p) { return p.row === current.row && p.col === (gridSize - 1 - current.col); });
                var mirroredTo = points.find(function(p) { return p.row === next.row && p.col === (gridSize - 1 - next.col); });
                
                lines.push({ from: current, to: next, isMirrored: false });
                
                if (mirroredFrom && mirroredTo) {
                    var isSameLine = (mirroredFrom.id === current.id && mirroredTo.id === next.id) ||
                                     (mirroredFrom.id === next.id && mirroredTo.id === current.id);
                    if (!isSameLine) {
                        lines.push({ from: mirroredFrom, to: mirroredTo, isMirrored: true });
                    }
                }
                current = next;
            }
            drawScene();
        }

        function handleInteraction(clientX, clientY) {
            var rect = canvas.getBoundingClientRect();
            var scaleX = canvas.width / rect.width;
            var scaleY = canvas.height / rect.height;

            var x = (clientX - rect.left) * scaleX;
            var y = (clientY - rect.top) * scaleY;

            var clickedPoint = null;
            var minDist = 35; // Larger touch radius for mobile screens

            points.forEach(function(p) {
                var dist = Math.hypot(p.x - x, p.y - y);
                if (dist < minDist) {
                    minDist = dist;
                    clickedPoint = p;
                }
            });

            if (clickedPoint) {
                if (!selectedPoint) {
                    selectedPoint = clickedPoint;
                } else {
                    if (selectedPoint.id !== clickedPoint.id) {
                        addLineSegment(selectedPoint, clickedPoint);
                    }
                    selectedPoint = null;
                }
                drawScene();
            }
        }

        canvas.addEventListener('click', function(e) {
            handleInteraction(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchend', function(e) {
            if (e.changedTouches.length > 0) {
                handleInteraction(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                e.preventDefault();
            }
        });

        window.onload = function() {
            resizeCanvas();
        };
    </script>
</body>
</html>
