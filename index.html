<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mun Vaasal - South Asian Kolam Studio</title>
    <style>
        :root {
            --bg-color: #1a0f0a;
            --card-bg: #2d1a12;
            --accent: #ff6b35;
            --accent-glow: rgba(255, 107, 53, 0.4);
            --text-main: #f4e8dc;
            --text-muted: #c2b2a3;
            --dot-color: #ffb703;
            --line-color: #ff6b35;
        }

        [data-theme="indigo"] {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent: #48cae4;
            --accent-glow: rgba(72, 202, 228, 0.4);
            --dot-color: #90e0ef;
            --line-color: #00b4d8;
        }

        [data-theme="emerald"] {
            --bg-color: #081c15;
            --card-bg: #1b4332;
            --accent: #52b788;
            --accent-glow: rgba(82, 183, 136, 0.4);
            --dot-color: #d8f3dc;
            --line-color: #74c69d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        canvas {
            touch-action: none;
            cursor: crosshair;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        button, select {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
            background: var(--accent);
            color: #fff;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
            grid-column: span 2;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .info-box {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            padding: 4px;
            line-height: 1.3;
        }
    </style>
</head>
<body data-theme="terracotta">

    <header>
        <h1>Mun Vaasal (முன் வாசல்)</h1>
        <p class="subtitle">Digital South Asian Threshold Art Studio</p>
    </header>

    <div class="app-container">
        <div class="canvas-wrapper">
            <canvas id="kolamCanvas" width="360" height="360"></canvas>
        </div>

        <div class="controls-grid">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="terracotta">Terracotta Heritage</option>
                <option value="indigo">Night Indigo</option>
                <option value="emerald">Sacred Emerald</option>
            </select>
            <button onclick="clearCanvas()">Clear Canvas</button>
            <button onclick="generateProceduralKolam()" class="primary">✨ Generate Sacred Pulli Pattern</button>
        </div>

        <div class="info-box">
            Swipe your finger across the dot grid (*Pulli*) or tap generate to weave traditional symmetrical threshold loops.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('kolamCanvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let points = [];
        let userPath = [];

        const gridSize = 5; // 5x5 Pulli grid
        const spacing = canvas.width / (gridSize + 1);

        function initGrid() {
            points = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    points.push({
                        x: spacing * (c + 1),
                        y: spacing * (r + 1)
                    });
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Dots (Pulli)
            const dotColor = getComputedStyle(document.body).getPropertyValue('--dot-color').trim();
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = dotColor;
                ctx.fill();
            });

            // Draw User Strokes
            if (userPath.length > 1) {
                const lineColor = getComputedStyle(document.body).getPropertyValue('--line-color').trim();
                ctx.beginPath();
                ctx.moveTo(userPath[0].x, userPath[0].y);
                for (let i = 1; i < userPath.length; i++) {
                    ctx.lineTo(userPath[i].x, userPath[i].y);
                }
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        function changeTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            drawScene();
        }

        function clearCanvas() {
            userPath = [];
            drawScene();
        }

        function generateProceduralKolam() {
            userPath = [];
            // Draw a symmetrical procedural loops connecting points
            let startPoint = points[Math.floor(Math.random() * points.length)];
            userPath.push(startPoint);
            
            for(let i = 0; i < 6; i++) {
                let nextPoint = points[Math.floor(Math.random() * points.length)];
                userPath.push(nextPoint);
            }
            drawScene();
        }

        // Touch and Mouse Event Handlers
        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            userPath.push(getTouchPos(e));
            drawScene();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            userPath.push(getTouchPos(e));
            drawScene();
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            userPath.push(getTouchPos(e));
            drawScene();
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            userPath.push(getTouchPos(e));
            drawScene();
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => {
            isDrawing = false;
        });

        initGrid();
        drawScene();
    </script>
</body>
</html>
